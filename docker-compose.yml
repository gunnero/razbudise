services:
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    working_dir: /var/www/html
    command: >
      sh -c "composer install &&
      if [ ! -f .env ]; then cp .env.example .env; fi &&
      if ! grep -Eq '^APP_KEY=.+$' .env; then php artisan key:generate --force; fi &&
      php artisan serve --host=0.0.0.0 --port=8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:${BACKEND_PORT:-8001}
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-3001}
      DB_CONNECTION: pgsql
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-razbudise}
      DB_USERNAME: ${POSTGRES_USER:-razbudise}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-razbudise}
      CACHE_STORE: redis
      REDIS_HOST: redis
      QUEUE_CONNECTION: database
      SCOUT_DRIVER: meilisearch
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_KEY: ""
    volumes:
      - ./backend:/var/www/html
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
      meilisearch:
        condition: service_started

  queue:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    working_dir: /var/www/html
    command: >
      sh -c "composer install &&
      if [ ! -f .env ]; then cp .env.example .env; fi &&
      if ! grep -Eq '^APP_KEY=.+$' .env; then php artisan key:generate --force; fi &&
      php artisan queue:work --sleep=3 --tries=3 --timeout=90"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-razbudise}
      DB_USERNAME: ${POSTGRES_USER:-razbudise}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-razbudise}
      CACHE_STORE: redis
      REDIS_HOST: redis
      QUEUE_CONNECTION: database
      SCOUT_DRIVER: meilisearch
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_KEY: ""
    volumes:
      - ./backend:/var/www/html
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
      meilisearch:
        condition: service_started

  scheduler:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    working_dir: /var/www/html
    command: >
      sh -c "composer install &&
      if [ ! -f .env ]; then cp .env.example .env; fi &&
      if ! grep -Eq '^APP_KEY=.+$' .env; then php artisan key:generate --force; fi &&
      php artisan schedule:work"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-razbudise}
      DB_USERNAME: ${POSTGRES_USER:-razbudise}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-razbudise}
      CACHE_STORE: redis
      REDIS_HOST: redis
      QUEUE_CONNECTION: database
      SCOUT_DRIVER: meilisearch
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_KEY: ""
    volumes:
      - ./backend:/var/www/html
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
      meilisearch:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    environment:
      NEXT_PUBLIC_SITE_URL: http://localhost:${FRONTEND_PORT:-3001}
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${BACKEND_PORT:-8001}/api
      INTERNAL_API_BASE_URL: http://backend:8000/api
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
    depends_on:
      - backend

  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-razbudise}
      POSTGRES_USER: ${POSTGRES_USER:-razbudise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-razbudise}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-razbudise} -d ${POSTGRES_DB:-razbudise}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data

  meilisearch:
    image: getmeili/meilisearch:v1.16
    environment:
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: ${MEILI_NO_ANALYTICS:-true}
    ports:
      - "${MEILISEARCH_PORT:-7700}:7700"
    volumes:
      - meilisearch_data:/meili_data

volumes:
  postgres_data:
  redis_data:
  meilisearch_data:
  frontend_node_modules:
