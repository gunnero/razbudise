name: Bug report
description: Report a reproducible product defect
body:
  - type: markdown
    attributes:
      value: Do not include credentials, personal data, unpublished content, or security vulnerabilities. Report security issues privately according to SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: Problem
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
